<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Challenge List</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/list_icon.png">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="assets/list_icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                <div>
                    <h1>Short Challenge List</h1>
                    <p class="subtitle">Short Challenge List</p>
                </div>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" data-tab="levels">Levels</button>
            <button class="nav-btn" data-tab="records">Records</button>
        </nav>

        <main>
            <!-- Levels Tab -->
            <section id="levels-tab" class="tab-content active">
                <div class="controls">
                    <input type="text" id="level-search" placeholder="Search levels..." class="search-input">
                </div>
                <div id="levels-container" class="list-container">
                    <div class="loading">Loading levels...</div>
                </div>
            </section>

            <!-- Records Tab -->
            <section id="records-tab" class="tab-content">
                <div class="controls">
                    <input type="text" id="record-search" placeholder="Search records..." class="search-input">
                </div>
                <div id="records-container" class="list-container">
                    <div class="loading">Loading records...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Short Challenge List &copy; 2024 | Based on GDListTemplate by <a href="https://github.com/TheShittyList" target="_blank">TheShittyList</a></p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
